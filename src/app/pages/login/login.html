<div class="auth-container">
  <div class="auth-card">
    <h2>🐾 PawCare</h2>
    <p class="subtitle">
      {{ isRegisterMode ? 'Buat akun baru untuk kelola kesehatan anabul' : 'Masuk ke akun PawCare kamu' }}
    </p>

    <form (ngSubmit)="handleAuth()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="nama@email.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Minimal 6 karakter" required />
      </div>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Memproses...' : (isRegisterMode ? 'Daftar Sekarang' : 'Masuk') }}
      </button>
    </form>

    <p class="toggle-text">
      {{ isRegisterMode ? 'Sudah punya akun?' : 'Belum punya akun?' }}
      <a (click)="isRegisterMode = !isRegisterMode">
        {{ isRegisterMode ? 'Masuk di sini' : 'Daftar di sini' }}
      </a>
    </p>
  </div>
</div>
